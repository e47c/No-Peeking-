<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No peeking!</title>
    <style>
      :root {
        --red: #e8111c; --red-dark: #7d070d; --gold: #c9a063; --gold-dim: rgba(201,160,99,.5);
        --ink: #0b0b0b; --paper: #f4f0e8; --green: #7dffa0;
        --font: "Arial Black", Impact, "Segoe UI Black", "Segoe UI", Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; color: var(--paper);
        background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.78)), url(/bg.jpg) center / cover fixed #0b0b0b; }
      .hidden { display: none !important; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 50px; }

      /* ---------- top bar ---------- */
      .hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 10px 18px;
        background: rgba(8,8,8,.88); backdrop-filter: blur(4px); border-bottom: 3px solid var(--red); }
      .hud::after { content: ""; position: absolute; left: 0; bottom: -3px; width: 38%; height: 3px; background: var(--gold); }
      .logo { margin: 0; display: flex; gap: 3px; font-family: var(--font); }
      .logo span { font-size: 22px; line-height: 1; padding: 5px 7px; border: 2px solid #000; background: var(--paper); color: var(--ink); box-shadow: 2px 2px 0 #000; }
      .logo span:nth-child(3n+1) { background: var(--red); color: #fff; transform: rotate(-4deg); }
      .logo span:nth-child(3n+2) { background: var(--ink); color: #fff; border-color: var(--paper); transform: rotate(3deg); }
      .logo span:nth-child(3n) { transform: rotate(-2deg) translateY(-1px); }
      .logo span.sp { width: 12px; padding: 0; background: none !important; border: 0; box-shadow: none; }
      .grow { flex: 1; }
      .chip { font-family: var(--font); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding: 6px 16px;
        background: var(--red); color: #fff; transform: skew(-10deg); border: 2px solid #000; box-shadow: 3px 3px 0 var(--gold); }
      .icon-btn { padding: 8px 12px !important; font-size: 18px !important; }
      #status { color: var(--gold); font-style: italic; margin: 14px 0 0; font-weight: 600; }
      #status:empty { display: none; }
      #error { background: var(--red); color: #fff; padding: 9px 14px; font-weight: 700; white-space: pre-wrap; border-left: 6px solid #000; margin: 12px 0 0; }
      #error:empty { display: none; }

      /* ---------- panels ---------- */
      .panel { background: rgba(8,8,8,.82); backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,.12);
        border-top: 4px solid var(--red); padding: 22px 22px 24px; margin: 30px 0 8px; position: relative; }
      h2 { position: absolute; top: -22px; left: 14px; margin: 0; padding: 5px 22px; background: var(--red); color: #fff;
        font-family: var(--font); font-size: 16px; letter-spacing: .1em; text-transform: uppercase; transform: skew(-10deg);
        border: 2px solid #000; box-shadow: 4px 4px 0 var(--gold); }
      p.note { color: var(--gold); margin: 0 0 14px; font-style: italic; }

      /* ---------- buttons ---------- */
      button { font-family: var(--font); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; background: var(--red);
        color: #fff; border: 2px solid #000; padding: 10px 24px; cursor: pointer; transform: skew(-8deg);
        box-shadow: 4px 4px 0 var(--gold); transition: transform .12s, box-shadow .12s, background .12s; }
      button:hover:not(:disabled) { transform: skew(-8deg) translate(-2px,-2px); box-shadow: 7px 7px 0 var(--gold); background: #ff2430; }
      button:active:not(:disabled) { transform: skew(-8deg) translate(2px,2px); box-shadow: 1px 1px 0 var(--gold); }
      button:disabled { background: #2a2a2a; color: #777; box-shadow: 4px 4px 0 #111; cursor: not-allowed; }
      button.gold { background: var(--gold); color: #000; box-shadow: 4px 4px 0 #000; }
      button.gold:hover:not(:disabled) { background: #e2b87a; box-shadow: 7px 7px 0 #000; }
      button.big { font-size: 18px; padding: 14px 34px; }
      button.green { background: #1fa64a; } button.green:hover:not(:disabled) { background: #28c85b; }
      button.dark { background: #1b1b1b; border-color: var(--gold-dim); }

      /* ---------- avatars and profile cards ---------- */
      .avatar { --size: 56px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; overflow: hidden;
        display: flex; align-items: center; justify-content: center; background: var(--accent, #333); color: #fff;
        font-family: var(--font); font-size: calc(var(--size) * .42); border: 3px solid var(--accent, var(--gold));
        box-shadow: 0 0 0 3px #000, 0 0 16px color-mix(in srgb, var(--accent, #c9a063) 60%, transparent); }
      .avatar img { width: 100%; height: 100%; }
      .avatar.sm { --size: 44px; } .avatar.lg { --size: 88px; } .avatar.xl { --size: 120px; }

      #players { display: flex; flex-wrap: wrap; gap: 20px; }
      .profile { width: 168px; padding: 22px 12px 14px; text-align: center; position: relative;
        background: linear-gradient(170deg, #1d1d1d, #0b0b0b); border: 2px solid rgba(255,255,255,.12); border-top: 5px solid var(--accent); }
      .profile::before, .tile::before { content: ""; position: absolute; top: 0; right: 0; width: 44px; height: 44px;
        background: linear-gradient(225deg, var(--accent) 50%, transparent 50%); }
      .profile.offline, .tile.offline { opacity: .45; filter: grayscale(.8); }
      .profile .avatar { margin: 0 auto 10px; }
      .crown { position: absolute; top: 6px; left: 8px; font-size: 11px; color: var(--gold); font-weight: 800; letter-spacing: .06em; }
      .pname { font-family: var(--font); font-size: 15px; text-transform: uppercase; word-break: break-word; }
      .pips { display: flex; gap: 6px; justify-content: center; margin: 10px 0 6px; }
      .pip { width: 16px; height: 16px; background: #2b2b2b; border: 2px solid #000; transform: skew(-12deg); }
      .pip.on { background: var(--gold); }
      .pip.strike.on { background: var(--red); box-shadow: 0 0 8px var(--red); }
      .pstat { font-size: 11px; letter-spacing: .12em; color: var(--gold); font-weight: 800; }
      .pstat.ready { color: var(--green); }

      /* ---------- upload cards ---------- */
      #slots { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 18px; }
      .slotcard { width: 250px; background: linear-gradient(170deg,#1b1b1b,#0b0b0b); border: 2px solid rgba(255,255,255,.12);
        border-top: 5px solid var(--gold); padding: 12px; }
      .slotcard.done { border-top-color: var(--green); }
      .slot-head { font-family: var(--font); color: var(--red); letter-spacing: .1em; font-size: 14px; margin-bottom: 8px; }
      .drop { display: flex; align-items: center; justify-content: center; text-align: center; width: 100%; aspect-ratio: 1; cursor: pointer;
        background: repeating-linear-gradient(135deg, #140304 0 12px, #1d0507 12px 24px); border: 2px dashed var(--gold-dim);
        color: var(--gold); font-family: var(--font); font-size: 15px; letter-spacing: .06em; overflow: hidden; margin-bottom: 10px; }
      .drop:hover { border-color: var(--red); }
      .drop input { display: none; }
      .drop img { width: 100%; height: 100%; object-fit: contain; background: #000; }
      .slotcard input[type=text] { width: 100%; padding: 10px 12px; background: #000; color: var(--paper); border: 2px solid var(--gold-dim);
        font-size: 15px; outline: none; margin-bottom: 10px; }
      .slotcard input[type=text]:focus { border-color: var(--red); }
      .saved { display: block; margin-top: 10px; color: var(--green); font-size: 13px; font-weight: 800; min-height: 16px; }
      #hint { color: var(--gold); margin-bottom: 14px; font-style: italic; font-weight: 600; }

      /* ---------- round: turn bar ---------- */
      #round { margin-top: 22px; }
      .turnbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 16px 22px; margin-bottom: 22px;
        background: linear-gradient(90deg, #2a0508, #0d0d0d 85%); border: 1px solid rgba(255,255,255,.12); border-left: 9px solid var(--gold); }
      .turnbar.mine { background: linear-gradient(90deg, var(--red), #3a0508 85%); border-left-color: #fff; animation: glow 1.3s ease-in-out infinite alternate; }
      .turnbar.done { border-left-color: var(--green); }
      .tb-text { flex: 1; min-width: 220px; }
      .tb-title { font-family: var(--font); font-size: 24px; text-transform: uppercase; letter-spacing: .04em; }
      .tb-sub { color: #d9d2c3; margin-top: 4px; }
      .tb-actions { display: flex; gap: 12px; flex-wrap: wrap; }
      @keyframes glow { from { box-shadow: 0 0 6px rgba(232,17,28,.4); } to { box-shadow: 0 0 30px rgba(232,17,28,.95); } }

      /* ---------- round: player cards (profile + big image) ---------- */
      #table { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 340px)); gap: 26px; justify-content: center; }
      .tile { position: relative; padding: 12px 12px 14px; background: linear-gradient(175deg, #1b1b1b, #090909);
        border: 2px solid rgba(255,255,255,.14); border-top: 6px solid var(--accent); box-shadow: 6px 6px 0 #000; }
      .tile.me { outline: 3px solid var(--red); outline-offset: 3px; }
      .tile.asking { box-shadow: 0 0 0 3px var(--gold), 0 0 34px rgba(201,160,99,.75); }
      .tile.solved { border-color: var(--green); }
      .tile.out { filter: grayscale(.7) brightness(.8); }
      .tile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding-right: 36px; }
      .tile-name { font-family: var(--font); font-size: 15px; text-transform: uppercase; word-break: break-word; line-height: 1.15; }
      .tile-score { color: var(--gold); font-weight: 800; font-size: 14px; margin-top: 2px; }
      .pic { position: relative; width: 100%; aspect-ratio: 1; background: #000; border: 2px solid #000; outline: 2px solid var(--gold-dim);
        display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .pic img { width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
      .pic.mystery { background: repeating-linear-gradient(135deg, #1a0305 0 14px, #260508 14px 28px); color: var(--red);
        font-family: var(--font); font-size: 120px; text-shadow: 5px 5px 0 #000; }
      .zoomhint { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.7); font-size: 11px; padding: 2px 7px; color: var(--gold); pointer-events: none; }
      .cname { margin-top: 10px; text-align: center; font-family: var(--font); font-size: 18px; text-transform: uppercase; min-height: 22px; letter-spacing: .04em; }
      .tile.me .cname { color: var(--red); }
      .tile-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
      .pips.inline { margin: 0; }
      .state { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 4px 11px; background: #222; border: 1px solid #444; transform: skew(-10deg); }
      .state.asking { background: var(--gold); color: #000; border-color: #000; }
      .state.solved { background: #1fa64a; color: #fff; border-color: #000; }
      .state.out { background: #000; color: var(--red); border-color: var(--red); }
      #log { margin-top: 18px; text-align: center; font-style: italic; color: var(--gold); font-weight: 600; min-height: 20px; }

      /* ---------- guess stage (full screen) ---------- */
      .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.82); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
      .gcard { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; align-items: center; max-width: min(920px, 96vw);
        padding: 26px; background: linear-gradient(160deg, #1a0507, #080808 70%); border: 3px solid var(--red);
        box-shadow: 10px 10px 0 #000, 0 0 50px rgba(232,17,28,.5); }
      .gleft { width: min(340px, 80vw); }
      .gright { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; min-width: 250px; max-width: 360px; }
      .gtitle { font-family: var(--font); font-size: 26px; text-transform: uppercase; }
      .gsub { color: var(--gold); font-style: italic; }
      .gname { font-family: var(--font); font-size: 30px; color: #fff; background: var(--red); padding: 6px 20px; transform: skew(-8deg); border: 2px solid #000; box-shadow: 4px 4px 0 var(--gold); }
      .mic { font-size: 64px; animation: pulse .8s ease-in-out infinite alternate; }
      .votes { font-weight: 800; font-size: 16px; }
      .gactions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
      @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.25); } }

      /* ---------- game over ---------- */
      .podium { display: flex; align-items: flex-end; justify-content: center; gap: 18px; margin: 14px 0 26px; }
      .pod { width: 170px; text-align: center; }
      .pod .avatar { margin: 0 auto 8px; }
      .pod .pname { margin-bottom: 6px; }
      .pod .base { background: linear-gradient(180deg, var(--accent), #1a1a1a); border: 2px solid #000; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-start; padding-top: 10px; font-family: var(--font); }
      .pod .base .medal { font-size: 38px; } .pod .base .pts { font-size: 20px; }
      .pod.p1 .base { height: 190px; } .pod.p2 .base { height: 140px; } .pod.p3 .base { height: 105px; }
      .score-row { background: rgba(20,20,20,.95); border: 2px solid var(--gold-dim); border-left: 6px solid var(--red); padding: 10px 16px;
        margin: 0 auto 8px; max-width: 460px; display: flex; justify-content: space-between; font-family: var(--font); font-size: 15px; }

      /* ---------- effects ---------- */
      #fx { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; }
      #confetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
      .banner { padding: 14px 46px; text-align: center; font-family: var(--font); transform: skew(-8deg); border: 4px solid #000;
        animation: slam 2.6s both; max-width: 94vw; }
      .banner-main { font-size: clamp(30px, 8vw, 76px); line-height: 1.05; text-transform: uppercase; }
      .banner-sub { font-size: clamp(16px, 3.4vw, 28px); margin-top: 6px; }
      .banner.good { background: var(--gold); color: #000; box-shadow: 8px 8px 0 #000; }
      .banner.bad { background: #000; color: var(--red); border-color: var(--red); box-shadow: 8px 8px 0 var(--red-dark); animation: slam 2.6s both, shake .4s 2; }
      .banner.info { background: var(--red); color: #fff; box-shadow: 8px 8px 0 var(--gold); }
      @keyframes slam { 0% { transform: skew(-8deg) scale(2.4); opacity: 0; } 10% { transform: skew(-8deg) scale(1); opacity: 1; }
        78% { opacity: 1; } 100% { transform: skew(-8deg) scale(.95); opacity: 0; } }
      @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -14px; } 75% { margin-left: 14px; } }

      #legal { margin-top: 30px; text-align: center; font-size: 12px; color: #9c968a; }
      #legal a { color: var(--gold); }
      #lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; cursor: zoom-out; padding: 16px; }
      #lightbox img { max-width: 94vw; max-height: 80vh; border: 3px solid var(--gold); background: #000; }
      #lightbox div { font-family: var(--font); font-size: 26px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <header class="hud">
      <h1 class="logo" aria-label="No peeking!"><span>N</span><span>O</span><span class="sp"></span><span>P</span><span>E</span><span>E</span><span>K</span><span>I</span><span>N</span><span>G</span><span>!</span></h1>
      <div class="grow"></div>
      <div id="roundChip" class="chip hidden"></div>
      <button id="muteBtn" class="icon-btn dark" title="Sound on/off">🔊</button>
    </header>

    <div class="wrap">
      <div id="status">Connecting to Discord...</div>
      <div id="error"></div>

      <section id="lobby" class="hidden">
        <div class="panel">
          <h2>Players</h2>
          <div id="players"></div>
        </div>
        <div class="panel">
          <h2>Your 3 cards</h2>
          <p class="note">One character per round. Tap a card to choose an image, then type its name and save.</p>
          <div id="slots"></div>
          <div id="hint"></div>
          <button id="startBtn" class="big hidden">Start game</button>
        </div>
      </section>

      <section id="round" class="hidden">
        <div id="turnBar" class="turnbar"></div>
        <div id="table"></div>
        <div id="log"></div>
        <div style="margin-top:18px;text-align:center"><button id="nextBtn" class="big gold hidden">Next round</button></div>
      </section>

      <section id="gameend" class="hidden">
        <div class="panel">
          <h2>Game over!</h2>
          <p class="note">All images have been deleted from the server.</p>
          <div id="podium" class="podium"></div>
          <div id="scoreboard"></div>
        </div>
      </section>

      <div id="hostbar" class="hidden" style="margin-top:26px;text-align:center">
        <button id="resetBtn" class="dark">Back to lobby (deletes all images)</button>
      </div>
      <footer id="legal" class="hidden">
        <a id="termsLink" href="#">Terms of Service</a> &nbsp;•&nbsp; <a id="privacyLink" href="#">Privacy Policy</a>
      </footer>
    </div>

    <div id="guessStage" class="overlay hidden"></div>
    <div id="fx"></div>
    <canvas id="confetti"></canvas>
    <div id="lightbox" class="hidden"><img alt="" /><div></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
